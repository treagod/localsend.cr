name: CI

on:
  push:
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.21.0
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install
      - name: Check formatting
        run: crystal tool format --check src spec examples
      - name: Run specs
        run: crystal spec
      - name: Build examples
        run: |
          for example in examples/*.cr; do
            crystal build --no-codegen "$example"
          done
